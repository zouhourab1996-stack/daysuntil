name: Build and publish daysuntil.bond

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/build-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-daysuntil-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependency
        run: python -m pip install -r requirements.txt

      - name: Sync to latest source and generate the complete static site
        run: |
          git fetch origin main
          git reset --hard origin/main
          python tools/generate_site.py

      - name: Validate generated output
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("docs")
          required = [
              "index.html", "robots.txt", "sitemap.xml", "ads.txt",
              "about/index.html", "contact/index.html",
              "privacy/index.html", "terms/index.html",
              "disclosure/index.html",
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit(f"Missing generated files: {missing}")

          sitemap = ET.parse(root / "sitemap.xml").getroot()
          urls = [n.text for n in sitemap.iter() if n.tag.endswith("}loc")]
          if not urls or "https://daysuntil.bond/" not in urls:
              raise SystemExit("Sitemap is empty or missing the homepage")

          html = (root / "index.html").read_text(encoding="utf-8")
          if "<h1>" not in html or "id=\"main\"" not in html:
              raise SystemExit("Homepage failed basic HTML checks")

          print(f"Validated {len(urls)} sitemap URLs and required pages.")
          PY

      - name: Publish generated pages to GitHub Pages source
        run: |
          if [[ -n "$(git status --porcelain docs)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Build and publish generated site"
            git push
          else
            echo "Generated site is already up to date."
          fi
